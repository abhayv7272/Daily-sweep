name: Daily Sweep Report

on:
  schedule:
    # TARGET: email aapko ~20:30 IST tak milni chahiye. Queue + data fetch +
    # charts + SMTP milkar ~6-7 minute lete hain, isliye trigger 20:23 IST
    # (= 14:53 UTC) par rakha hai. GitHub cron HAMESHA UTC mein hota hai, aur
    # na GitHub par na India mein DST hai — saal bhar waqt seedha rehta hai.
    #
    # ZAROORI — minute :00 (top-of-hour) mat lagana: usi minute duniya bhar ke
    # repos ek saath queue hote hain aur free runner pool mein trigger GHANTON
    # late ho jata hai (14-15 Sept 2026 ko yahi hua tha — 14:00 UTC ka cron
    # 17:50/18:57 UTC par start hua, email ~11:25 PM IST par gayi). Off-peak
    # minute (:53) par delay aam taur par kuch minute hi reh jata hai.
    - cron: "53 14 * * *"
  # Optional: bilkul exact-time chahiye to kisi external scheduler (cron-job.org
  # wagairah) se repository_dispatch ping karwao — README "§7 exact-time option".
  repository_dispatch:
    types: [daily-sweep]
  workflow_dispatch:
    inputs:
      limit:
        description: "Use only the first N NSE symbols (0 = full market). Use 60 for a quick test."
        required: false
        default: "0"
      send_email:
        description: "Send the email?"
        type: boolean
        required: false
        default: true

concurrency:
  group: daily-sweep
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install -q -U pip
          pip install -q -r requirements.txt

      - name: Offline diagnosis (engine contract tests, 86 checks)
        env:
          MPLBACKEND: Agg
        run: python tests/test_offline.py

      - name: Run screener and email the report
        env:
          MY_EMAIL: ${{ secrets.MY_EMAIL }}
          MY_APP_PASSWORD: ${{ secrets.MY_APP_PASSWORD }}
          # optional: only needed if the report should go somewhere other than MY_EMAIL
          REPORT_TO: ${{ secrets.REPORT_TO }}
          # Scheduled run par report header ka transparency note: agar GitHub ne
          # trigger dher der queue karke late diya, to email mein khud likha aa
          # jayega "queued Xh Ym late by GitHub (planned ~20:30 IST)".
          # Manual/dispatch trigger par khali rehta hai (note nahi dikhta).
          EXPECTED_SEND_IST: ${{ github.event_name == 'schedule' && '20:30' || '' }}
          MPLBACKEND: Agg
          PYTHONUNBUFFERED: "1"
        run: |
          ARGS=""
          if [ "${{ inputs.limit }}" != "" ] && [ "${{ inputs.limit }}" != "0" ]; then
            ARGS="$ARGS --limit ${{ inputs.limit }}"
          fi
          if [ "${{ inputs.send_email }}" = "false" ]; then
            ARGS="$ARGS --no-email"
          fi
          echo "run_sweep.py $ARGS"
          python run_sweep.py $ARGS

      - name: Upload report artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-sweep-report
          path: |
            out/*.html
            out/*.csv
            out/charts/*.png
          retention-days: 60
          if-no-files-found: warn
