name: Daily Sweep Report

on:
  # ---- AUTOMATIC TRIGGER: sirf ek, external scheduler se -------------------
  # GitHub ka apna `schedule:` (cron) JAAN-BOOJH KAR YAHAN NAHI HAI.
  #
  # Reason: cron-job.org ka ping aur GitHub ka internal cron dono ~20:23 IST par
  # fire karte the ⇒ same din do runs ⇒ DUPLICATE EMAIL. Isliye automatic run ka
  # single source of truth ab cron-job.org hai, jo exact waqt par ping karta hai
  # (GitHub ki best-effort queue wait nahi karni padti — 14-15 Sept 2026 ko
  # 14:00 UTC ka cron 17:50/18:57 UTC par start hua tha, email ~11:25 PM IST
  # par gayi thi; external ping par aisi deri nahi hoti).
  #
  # Setup: README "§7a — Automatic daily trigger" — cron-job.org par daily 20:23 IST,
  # POST https://api.github.com/repos/abhayv7272/Daily-sweep/dispatches
  # body {"event_type": "daily-sweep"}.
  #
  # DOBARA `schedule:` cron MAT jodna, warna duplicate email wapas aa jayegi.
  repository_dispatch:
    types: [daily-sweep]
  # Manual run — hamesha available (test karna ho ya kisi din ping miss ho jaye
  # to report dubara nikalna ho). Manual run par duplicate-guard apply nahi hota:
  # jo bologe wahi hoga, email bhi.
  workflow_dispatch:
    inputs:
      limit:
        description: "Use only the first N NSE symbols (0 = full market). Use 60 for a quick test."
        required: false
        default: "0"
      send_email:
        description: "Send the email?"
        type: boolean
        required: false
        default: true

concurrency:
  group: daily-sweep
  cancel-in-progress: false

permissions:
  contents: read
  # duplicate-email guard ko aaj ke pichhle successful runs padhne hain
  actions: read

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install -q -U pip
          pip install -q -r requirements.txt

      - name: Offline diagnosis (engine contract tests, 86 checks)
        env:
          MPLBACKEND: Agg
        run: python tests/test_offline.py

      - name: Duplicate-email guard (automated runs only)
        if: github.event_name != 'workflow_dispatch'
        id: dedupe
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # FAIL-OPEN guard: agar PICHHLE 12 GHANTE mein isi branch ka koi
          # automatic run SUCCESSFULLY complete ho chuka hai — matlab aaj ki
          # email already chali gayi hai — to is run se email skip kar do, warna
          # duplicate email chali jaati hai (double ping, cron-job.org retry, ya
          # galti se do scheduler lag jayein to).
          #
          # 12h rolling window, "aaj ki IST date" NAHI: duplicate midnight IST ke
          # aas-paas straddle kar sakta hai — 16 Sept 2026 ko schedule-run 23:15
          # IST aur dispatch-run 00:03 IST (agli date) par hua, dono successful,
          # do emails. Normal cadence 24h hai, isliye 12h window legit email nahi
          # rokti.
          #
          # Manual (workflow_dispatch) run is guard ke bahar hai — wo hamesha wahi
          # karta hai jo aapne input diya. Check fail hua (API/rate-limit/jq) to
          # PRIOR khali rehta hai aur email normally chali jaati hai.
          NOW=$(date +%s)
          CUTOFF=$(( NOW - 43200 ))
          echo "Looking for an already-successful automatic run since $(TZ=Asia/Kolkata date -d "@$CUTOFF" +'%F %H:%M IST') (epoch $CUTOFF)..."
          PRIOR=$( { gh run list \
                       --workflow=daily-sweep.yml \
                       --branch="$GITHUB_REF_NAME" \
                       --status=success \
                       --limit=30 \
                       --json databaseId,event,createdAt \
                     | jq -r --argjson cutoff "$CUTOFF" --argjson me "$GITHUB_RUN_ID" '
                         [ .[]
                           | select(.databaseId != $me)
                           | select(.event == "repository_dispatch" or .event == "schedule")
                           | select((.createdAt | sub("\\.[0-9]+"; "") | fromdate) >= $cutoff)
                         ] | length'; } 2>/dev/null || true )
          if [ -n "$PRIOR" ] && [ "$PRIOR" -gt 0 ] 2>/dev/null; then
            echo "skip_email=true" >> "$GITHUB_OUTPUT"
            {
              echo "⚠️ **Duplicate-email guard:** pichhle 12 ghante mein ek automatic run already successful raha hai (aaj ki email ja chuki hai), isliye is run se email nahi bheji gayi."
              echo "Report + artifacts is run par bhi bane hain (proof ki pipeline healthy hai). Dobara email chahiye to **Actions → Run workflow** (manual) chalao."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "skip_email=false" >> "$GITHUB_OUTPUT"
            echo "No successful automatic run in the last 12h (prior='${PRIOR:-check unavailable}') ⇒ email will be sent."
          fi

      - name: Run screener and email the report
        env:
          MY_EMAIL: ${{ secrets.MY_EMAIL }}
          MY_APP_PASSWORD: ${{ secrets.MY_APP_PASSWORD }}
          # optional: only needed if the report should go somewhere other than MY_EMAIL
          REPORT_TO: ${{ secrets.REPORT_TO }}
          # Automatic run (cron-job.org ka repository_dispatch ping) par report
          # header ka transparency note: agar runner dher der baad start hua, to
          # email mein khud likha aa jayega "run started Xh Ym late (planned
          # ~20:30 IST · GitHub runner queue)". Manual trigger par khali rehta
          # hai (note nahi dikhta).
          EXPECTED_SEND_IST: ${{ (github.event_name == 'repository_dispatch' || github.event_name == 'schedule') && '20:30' || '' }}
          MPLBACKEND: Agg
          PYTHONUNBUFFERED: "1"
        run: |
          ARGS=""
          if [ "${{ inputs.limit }}" != "" ] && [ "${{ inputs.limit }}" != "0" ]; then
            ARGS="$ARGS --limit ${{ inputs.limit }}"
          fi
          if [ "${{ inputs.send_email }}" = "false" ] || [ "${{ steps.dedupe.outputs.skip_email }}" = "true" ]; then
            ARGS="$ARGS --no-email"
          fi
          echo "run_sweep.py $ARGS"
          python run_sweep.py $ARGS

      - name: Upload report artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-sweep-report
          path: |
            out/*.html
            out/*.csv
            out/charts/*.png
          retention-days: 60
          if-no-files-found: warn
